# The Python backend's admin endpoint this scheduler calls on a cron.
# When running locally: http://localhost:8000/api/admin/refresh-tles
# When running in Docker: http://backend:8000/api/admin/refresh-tles
api.url=http://localhost:8000/api/admin/refresh-tles

# MUST match ADMIN_API_KEY in backend/.env exactly, or every call is
# rejected with 403.
api.adminKey=replace_this_with_another_long_random_string

# Cron expression: how often to refresh. Default = every 15 minutes.
# Format is Quartz's 7-field cron: sec min hour day-of-month month day-of-week
scheduler.cronExpression=0 */15 * * * ?
